<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visualized Excel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Monoton&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- Theme tokens: navy · white · orange · grey (red only for errors) ---------- */
:root{
  --bg:#EDF0F5; --panel:#FFFFFF; --ink:#14203F; --muted:#5E687C; --line:#D5DAE3; --chip:#F2F4F8;
  --navy:#1B2A5B; --navy-deep:#0F1A3C; --org:#EE7B22; --org-ink:#B9580C; --org-soft:#FFF0E2;
  --grey:#8A93A6; --grey-soft:#EEF0F4; --red:#C62828; --red-soft:#FDECEA;
  --hl-o:#EE7B22; --hl-n:#1B2A5B; --hl-g:#8A93A6;
  --cell:#FFFFFF; --cellhead:#F2F4F8; --black:#000000;
  --sans:'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --gap:8px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0A1330; --panel:#121E46; --ink:#E7EBF6; --muted:#9AA6C4; --line:#24346B; --chip:#1A295A;
  --navy:#9DB2F0; --navy-deep:#0B1535; --org:#FF9A45; --org-ink:#FFAA5E; --org-soft:#3A2616;
  --grey:#8C97B5; --grey-soft:#1A2753; --red:#FF6B6B; --red-soft:#3A1720;
  --hl-o:#FF9A45; --hl-n:#9DB2F0; --hl-g:#8C97B5;
  --cell:#0F1A3E; --cellhead:#16244F; --black:#E7EBF6; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
code,.mono{font-family:var(--mono);font-size:.92em}
:focus-visible{outline:2px solid var(--org);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.app{height:100%;padding:1vh 1vw;display:grid;grid-template-rows:auto 1fr auto;gap:var(--gap)}
.site-foot{text-align:center;font-size:12px;color:var(--muted);padding:2px 0}
.site-foot a{color:var(--org-ink);text-decoration:none;font-weight:600}
.site-foot a:hover{text-decoration:underline}
header{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;column-gap:18px;min-height:46px}
.brand{font-family:'Monoton','Schibsted Grotesk',system-ui,sans-serif;font-size:clamp(1.6rem,2.4vw,2.1rem);line-height:1;letter-spacing:.02em;color:var(--navy);user-select:none}
:root[data-theme="dark"] .brand{color:var(--org)}
:root[data-theme="dark"] .sec{background:#1C2C66}
h1{margin:0;color:var(--org-ink);font-size:clamp(1.2rem,2.2vw,1.9rem);font-weight:700;letter-spacing:-.025em;line-height:1}
h1 small{font-size:.5em;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:10px}
.theme-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.theme-btn svg{width:18px;height:18px}
:root[data-theme="dark"] .theme-btn{background:var(--org);color:#0A1330;border-color:transparent}
.search{width:clamp(200px,22vw,300px);display:flex;align-items:center;gap:6px;padding:0 10px;height:36px;border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--muted)}
.search svg{width:15px;height:15px;flex:none}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:13px var(--sans);outline:none}
.search kbd{font:11px var(--mono);border:1px solid var(--line);border-radius:4px;padding:0 5px;line-height:16px}
.search:focus-within{border-color:var(--org)} .search:focus-within kbd{display:none}

.main{display:grid;grid-template-columns:minmax(210px,15fr) 85fr;gap:var(--gap);min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.panel-head{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13.5px;font-weight:600;flex:none;min-height:40px}
.panel-head .hint{margin-left:auto;font-weight:400;color:var(--muted);font-size:12.5px}
.panel-body{flex:1;min-height:0;overflow:auto;scrollbar-width:thin}
.empty{padding:18px;color:var(--muted);font-size:13px}

/* ---------- Sidebar ---------- */
.side nav{padding:6px}
.group-label{font-size:11.5px;color:var(--muted);padding:10px 6px 4px;font-weight:600}
.cat+.cat{margin-top:5px}
.sec{width:100%;display:flex;align-items:center;gap:8px;text-align:left;border:0;cursor:pointer;padding:7px 10px;border-radius:8px;background:var(--navy-deep);color:#8F9BB8;font-size:12px;line-height:1.3}
.sec-text{flex:1;min-width:0}
.sec b{display:block;color:#F3F5FA;font-size:13px;font-weight:600}
.sec .count{flex:none;min-width:22px;height:18px;padding:0 6px;border-radius:9px;background:var(--org);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.sec .chev{flex:none;width:14px;height:14px;color:#F3F5FA;transition:transform .2s}
.sec[aria-expanded="true"] .chev{transform:rotate(90deg)}
.sec.gp[aria-current="true"]{box-shadow:inset 3px 0 0 var(--org)}
.items{list-style:none;margin:4px 0 2px;padding:0 0 0 6px}
.items[hidden]{display:none}
.items button{width:100%;text-align:left;border:0;background:transparent;cursor:pointer;padding:5px 8px;border-radius:6px;font-size:12.5px;color:var(--ink);display:flex;align-items:center;gap:6px}
.items button:hover{background:var(--chip)}
.items button[aria-current="true"]{background:var(--org-soft);color:var(--org-ink);font-weight:600}
.items .lv{margin-left:auto;font-size:10px;color:var(--muted)}
.cat[hidden],.nomatch[hidden]{display:none}
.nomatch{margin:12px;color:var(--muted);font-size:13px;text-align:center}

/* ---------- Function dashboard ---------- */
.body{display:grid;grid-template-columns:34fr 42fr 24fr;grid-template-rows:47fr 53fr;gap:var(--gap);min-height:0;min-width:0}
.p-formula{grid-area:1/1} .p-sheet{grid-area:1/2} .p-output{grid-area:1/3}
.p-steps{grid-area:2/1} .p-qa{grid-area:2/2} .p-co{grid-area:2/3}
.body.page-mode{grid-template-columns:1fr;grid-template-rows:1fr}
.body.page-mode>.panel{display:none} .body.page-mode>.p-page{display:flex;grid-area:1/1}
.p-page{display:none}

.fname{padding:12px 14px 4px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.fname h2{margin:0;font-size:24px;letter-spacing:-.02em;color:var(--navy)}
:root[data-theme="dark"] .fname h2{color:#fff}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.B{background:var(--grey-soft);color:var(--ink)}
.badge.A{background:var(--navy);color:#fff;border-color:transparent}
:root[data-theme="dark"] .badge.A{color:#0A1330}
.badge.M{background:var(--org);color:#fff;border-color:transparent}
.ptabs{margin:2px 14px 10px;display:flex;flex-wrap:wrap;gap:6px}
.ptabs button{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:4px 12px;font:600 12.5px var(--mono);cursor:pointer;color:var(--ink)}
.ptabs button[aria-selected="true"]{background:var(--org);border-color:var(--org);color:#fff}
.ptabs button .n{font-family:var(--sans);font-weight:500;opacity:.7;margin-right:5px}
.pdesc{margin:0 14px 10px;font-size:13px;line-height:1.45;padding:6px 10px;border-radius:6px;background:var(--org-soft);color:var(--ink)}
.syn .dim{opacity:.35}
.does{padding:0 14px 8px;color:var(--muted);font-size:13.5px;line-height:1.45}
.syn{margin:0 14px 10px;padding:10px 12px;border-radius:8px;background:var(--chip);font:13px/1.6 var(--mono)}
.syn .fn{color:var(--navy);font-weight:600} :root[data-theme="dark"] .syn .fn{color:#fff}
.syn .arg{color:var(--org-ink)} .syn .opt{color:var(--grey)}
.args{margin:0 14px 12px;display:grid;gap:4px;font-size:12.5px}
.args div{display:grid;grid-template-columns:auto 1fr;gap:8px}
.args code{color:var(--org-ink);white-space:nowrap}
.fbar{margin:0 14px 14px;display:flex;align-items:stretch;border:1px solid var(--line);border-radius:6px;overflow:hidden;font:13.5px/1.5 var(--mono)}
.fbar .nm{padding:6px 8px;background:var(--cellhead);border-right:1px solid var(--line);color:var(--muted);min-width:46px;text-align:center}
.fbar .fx{padding:6px 8px;color:var(--grey);font-style:italic;border-right:1px solid var(--line);font-family:Georgia,serif}
.fbar .ftxt{padding:6px 10px;overflow-x:auto;white-space:nowrap;color:var(--black)}
.r-o,.r-n,.r-g{font-weight:600;border-radius:3px;padding:0 2px}
.r-o{color:var(--org-ink);background:color-mix(in srgb,var(--hl-o) 16%,transparent);box-shadow:inset 0 -2px 0 var(--hl-o)}
.r-n{color:var(--hl-n);background:color-mix(in srgb,var(--hl-n) 12%,transparent);box-shadow:inset 0 -2px 0 var(--hl-n)}
.r-g{color:var(--muted);background:color-mix(in srgb,var(--hl-g) 16%,transparent);box-shadow:inset 0 -2px 0 var(--hl-g)}

/* Worksheet */
.player{margin-left:auto;display:flex;align-items:center;gap:6px}
.speed{display:inline-flex;border:1px solid var(--line);border-radius:15px;overflow:hidden;margin-right:4px}
.speed button{border:0;background:transparent;font-size:11.5px;font-weight:600;color:var(--muted);padding:5px 7px;cursor:pointer}
.speed button+button{border-left:1px solid var(--line)}
.speed button[aria-pressed="true"]{background:var(--chip);color:var(--ink)}
.step-count{font-size:12px;color:var(--muted);min-width:44px;text-align:center;font-weight:500}
.pbtn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--panel);cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.pbtn svg{width:14px;height:14px} .pbtn:disabled{opacity:.35;cursor:default}
.pbtn.primary{background:var(--org);border-color:var(--org);color:#fff}
.sheet-wrap{padding:14px;display:flex;flex-direction:column;gap:12px}
.gridbox{position:relative;align-self:flex-start;max-width:100%;overflow-x:auto}
table.grid{border-collapse:collapse;font-size:13px;background:var(--cell);color:var(--black)}
.grid th,.grid td{border:1px solid var(--line);padding:5px 9px;height:28px;white-space:nowrap;min-width:52px}
.grid th{background:var(--cellhead);color:var(--muted);font-weight:500;font-size:11.5px;text-align:center}
.grid th.rn{min-width:30px;padding:0 6px}
.grid td.num{text-align:right;font-variant-numeric:tabular-nums}
.grid td.hdr{font-weight:600;background:var(--grey-soft)}
.grid td.hit{background:var(--org-soft)}
.grid td.hit::after{content:'✓';color:var(--org-ink);font-weight:700;margin-left:6px;font-size:11px}
.grid td.res{outline:2px solid var(--org);outline-offset:-2px;font-weight:700;color:var(--org-ink);font-family:var(--mono);font-size:12.5px}
.grid td.res.pending{color:var(--grey);font-weight:400}
.grid td.spill{background:var(--org-soft);font-weight:600}
.grid td.copied{color:var(--muted);font-style:italic}
.grid td.err{color:var(--red);font-weight:700}
.grid tr.hid td{background:repeating-linear-gradient(135deg,var(--grey-soft) 0 6px,transparent 6px 12px);color:var(--grey);text-decoration:line-through}
.hl{position:absolute;pointer-events:none;border:2.5px solid;border-radius:2px;transition:all .35s ease}
.hl.o{border-color:var(--hl-o);background:color-mix(in srgb,var(--hl-o) 10%,transparent)}
.hl.n{border-color:var(--hl-n);background:color-mix(in srgb,var(--hl-n) 9%,transparent)}
.hl.g{border-color:var(--hl-g);border-style:dashed;background:color-mix(in srgb,var(--hl-g) 10%,transparent)}
.hl.sp{border:2px dashed var(--org);background:transparent}
.chars{display:flex;flex-wrap:wrap;gap:3px}
.chars span{display:grid;grid-template-rows:auto auto;text-align:center;min-width:24px;border:1px solid var(--line);border-radius:4px;font:13px var(--mono);background:var(--cell);color:var(--black);transition:background .3s}
.chars span i{font-style:normal;font-size:9.5px;color:var(--muted);border-top:1px solid var(--line);padding:1px 0}
.chars span b{font-weight:500;padding:3px 0;white-space:pre}
.chars span.on{background:var(--org);color:#fff;border-color:var(--org)} .chars span.on i{color:#fff}
.chars span.mk{background:var(--org-soft);border-color:var(--org)}
.caption{font-size:13.5px;line-height:1.55;padding:10px 12px;border-left:3px solid var(--org);background:var(--chip);border-radius:0 8px 8px 0;min-height:44px}
.caption b{color:var(--org-ink)}

/* Output */
.out-card{margin:14px;padding:14px;border-radius:10px;background:var(--navy);color:#fff}
:root[data-theme="dark"] .out-card{background:var(--navy-deep);border:1px solid var(--line)}
.out-card .lbl{font-size:12px;opacity:.75}
.out-card .val{font:600 26px/1.25 var(--mono);color:#fff;margin-top:4px;word-break:break-word}
.out-card .val.wait{opacity:.4;font-size:18px}
.out-card .val.err{color:#FF8A80}
.out-card table{border-collapse:collapse;margin-top:6px;font:13px var(--mono)}
.out-card td{border:1px solid rgba(255,255,255,.25);padding:3px 8px}
.out-card .ty{margin-top:8px;font-size:11.5px;color:var(--org)}
.alts{margin:0 14px 14px}
.alts h3,.page h3{font-size:13px;margin:4px 0 8px;color:var(--muted);font-weight:600}
.alt{padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:12.5px}
.alt code{display:block;color:var(--navy);font-weight:600;white-space:pre-wrap;word-break:break-word}
:root[data-theme="dark"] .alt code{color:#fff}
.alt .ar{color:var(--org-ink);font-family:var(--mono);font-weight:600}
.alt p{margin:3px 0 0;color:var(--muted)}

/* Steps */
ol.steps{list-style:none;margin:0;padding:10px 12px;counter-reset:s}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:24px 1fr;gap:10px;padding:8px;border-radius:8px;cursor:pointer;opacity:.45;font-size:13px;line-height:1.5}
ol.steps li::before{content:counter(s);width:22px;height:22px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:11.5px;font-weight:700}
ol.steps li.done{opacity:.8} ol.steps li.done::before{background:var(--navy);color:#fff}
:root[data-theme="dark"] ol.steps li.done::before{color:#0A1330}
ol.steps li.cur{opacity:1;background:var(--org-soft)} ol.steps li.cur::before{background:var(--org);color:#fff}
ol.steps li code.ev{display:block;margin-top:4px;padding:4px 8px;border-radius:5px;background:var(--panel);border:1px solid var(--line);white-space:pre-wrap;word-break:break-word;font-size:12px}
ol.steps li b{color:var(--org-ink)}

/* Q&A + callouts */
.qa{padding:8px 10px}
details.q{border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--panel)}
details.q summary{cursor:pointer;padding:9px 12px;font-size:13px;font-weight:600;list-style:none;display:flex;gap:8px}
details.q summary::-webkit-details-marker{display:none}
details.q summary::before{content:'Q';color:var(--org-ink);font-weight:800}
details.q[open] summary{border-bottom:1px dashed var(--line)}
details.q .a{padding:9px 12px 11px;font-size:13px;line-height:1.55;color:var(--ink)}
.co{list-style:none;margin:0;padding:10px 12px;display:grid;gap:8px}
.co li{font-size:12.8px;line-height:1.5;padding:9px 10px 9px 12px;border-radius:8px;background:var(--chip);border-left:3px solid var(--navy)}
.co li.warn{border-left-color:var(--org);background:var(--org-soft)}
.co li.err{border-left-color:var(--red);background:var(--red-soft)}

/* ---------- Pages ---------- */
.page{padding:18px 22px 40px;max-width:1200px}
.page-intro{font-size:14px;color:var(--muted);line-height:1.55;max-width:75ch;margin:0 0 16px}
.page h2{margin:0 0 6px;font-size:26px;letter-spacing:-.02em;color:var(--navy)}
:root[data-theme="dark"] .page h2{color:#fff}
.tabhead{display:flex;align-items:center;gap:10px;margin:22px 0 10px}
.tabhead span{font-weight:700;font-size:15px;padding:4px 12px;border-radius:6px;background:var(--navy);color:#fff}
:root[data-theme="dark"] .tabhead span{color:#0A1330}
.tabhead i{flex:1;height:1px;background:var(--line)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--panel);display:flex;flex-direction:column;gap:8px}
.card h4{margin:0;font-size:14.5px;display:flex;gap:8px;align-items:center}
.card h4 .badge{margin-left:auto}
.card p{margin:0;font-size:13px;line-height:1.5;color:var(--muted)}
.path{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px}
.path span{padding:3px 8px;border-radius:5px;background:var(--chip);border:1px solid var(--line)}
.path span:first-child{background:var(--navy);color:#fff;border-color:var(--navy)}
:root[data-theme="dark"] .path span:first-child{color:#0A1330}
.path em{color:var(--grey);font-style:normal}
kbd.k{display:inline-block;font:600 11.5px var(--mono);padding:2px 6px;border-radius:5px;border:1px solid var(--line);border-bottom-width:2px;background:var(--cell);color:var(--black);white-space:nowrap}
.kline{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.kline small{color:var(--grey);margin:0 2px}
.ba{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch;font-size:12.5px}
.ba div{border-radius:8px;padding:8px 10px;font-family:var(--mono);white-space:pre-wrap;line-height:1.5}
.ba .b{background:var(--grey-soft);color:var(--muted)} .ba .a{background:var(--org-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--org) 40%,transparent)}
.ba svg{align-self:center;width:18px;height:18px;color:var(--org)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:18px;overflow:hidden;margin:6px 0 4px}
.seg button{border:0;background:transparent;cursor:pointer;padding:6px 14px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#0A1330}
.sc-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.sc{border-collapse:collapse;width:100%;font-size:13px}
.sc th{position:sticky;top:0;text-align:left;background:var(--navy);color:#fff;padding:9px 12px;font-weight:600}
:root[data-theme="dark"] .sc th{color:#0A1330}
.sc td{padding:8px 12px;border-top:1px solid var(--line);vertical-align:top}
.sc tr.grp td{background:var(--chip);font-weight:700;color:var(--org-ink);font-size:12px}
.sc td:first-child{min-width:220px}
.sc .col-hide{display:none}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-top:14px}
.rel{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--panel)}
.rel.gone{background:var(--grey-soft)}
.rel h4{margin:0;font-size:15px}
.rel .when{font-size:12px;color:var(--muted)}
.rel code.ex{display:block;padding:7px 10px;border-radius:6px;background:var(--chip);white-space:pre-wrap;word-break:break-word;font-size:12.5px}
.pill{align-self:flex-start;font-size:11px;font-weight:700;padding:2px 9px;border-radius:10px}
.pill.ga{background:var(--navy);color:#fff} :root[data-theme="dark"] .pill.ga{color:#0A1330}
.pill.pv{background:var(--org);color:#fff}
.pill.rt{background:var(--red);color:#fff}
.iq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:8px}
.foot{margin-top:24px;font-size:12px;color:var(--muted)}

@media (max-width: 1100px){
  body{overflow:auto;height:auto}
  .app{height:auto}
  .main{grid-template-columns:1fr}
  .side .panel-body{max-height:40vh}
  .body{grid-template-columns:1fr;grid-template-rows:none}

  .body .panel-body{overflow:visible}

  header{grid-template-columns:auto 1fr auto;row-gap:8px}

}

<body>

            <button class="pbtn primary" id="playBtn" aria-label="Play"></button>
            <button class="pbtn" id="nextBtn" aria-label="Next step"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>

        <div class="panel-body" id="steps"></div>

      <section class="panel p-qa" aria-label="Interview questions">

  </div>
  <footer class="site-foot">Built by Gopikrishna | <a href="mailto:gkrishna.ai.lab@gmail.com">gkrishna.ai.lab@gmail.com</a></footer>

<script>
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ---------- Theme ---------- */
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>';
const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg>';
const PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>';
const PAUSE='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
const ARROW='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg>';
let theme='light';
function applyTheme(t){
  document.documentElement.dataset.theme=t;
  $('themeBtn').innerHTML = t==='dark'?SUN:MOON;
  $('themeBtn').setAttribute('aria-label', t==='dark'?'Switch to light theme':'Switch to dark theme');
  requestAnimationFrame(drawHL);
}
$('themeBtn').addEventListener('click',()=>{ theme = theme==='dark'?'light':'dark'; applyTheme(theme); });

/* ---------- Content registries ---------- */
const CATS=[];      // {id,name,sub,type:'fn'|'page'}
const FN=[];        // function entries
const PAGES={};     // id -> render()
function CAT(id,name,sub,type='fn'){ CATS.push({id,name,sub,type}); }
function F(o){ o.id='f'+FN.length; FN.push(o); }
</script>
<script>
CAT('count','Count','How many cells?');
CAT('sum','Sum','Add it up');
CAT('avg','Average','Find the middle ground');
CAT('logic','Logical & IF','Make decisions');
CAT('lookup','Lookup & Reference','Find and fetch');
CAT('num','Numbers & Math','Round, rank, random');
CAT('date','Date & Time','Days, months, work days');
CAT('text','Text','Split, join, clean');
CAT('find','Find & Replace','Locate and swap');
CAT('stat','Statistical','Spread and relationships');
CAT('dyn','Dynamic Arrays','Microsoft 365 spill formulas');
CAT('attributes','Attributes','Features by ribbon tab','page');
CAT('tips','Tricks & Tips','Work faster, avoid traps','page');
CAT('shortcuts','Shortcuts','Windows · MacBook · iMac','page');
CAT('releases','New releases','Beyond your version','page');
CAT('interview','Interview questions','Basic → scenario','page');

/* ============ COUNT ============ */
F({n:'COUNT · COUNTA · COUNTBLANK', cat:'count', lvl:'B', keys:'count counta countblank',
 does:'COUNT counts cells holding <b>numbers</b>. COUNTA counts cells that are <b>not empty</b>. COUNTBLANK counts <b>empty</b> cells.',
 syn:'COUNT(value1, [value2], …) | COUNTA(value1, [value2], …) | COUNTBLANK(range)',
 args:[['value1','A range such as B2:B7, or individual values'],['range','The cells to check for blanks']],
 g:[['City','Area','','Result'],['Guwahati',5644,'','COUNT'],['Silchar',6214,'','COUNTA'],['Jorhat','NA','','COUNTBLANK'],['Tezpur',''],['Patna',8037],['Gaya',0]],
 at:'E2', f:'=COUNT(B2:B7)', out:'4', ty:'Number', fill:{E3:'5',E4:'1'},
 steps:[
  ['B2:B7','Excel looks at the range <b>B2:B7</b> — six cells in the Area column.','=COUNT(B2:B7)'],
  ['B2:B7 !B2 !B3 !B6 !B7','Only cells holding numbers are counted: 5644, 6214, 8037 and <b>0</b> (zero is a number too).','=COUNT({5644;6214;"NA";"";8037;0})'],
  ['B2:B7 B4~g B5~g','<b>"NA"</b> is text and <b>B5</b> is empty, so COUNT skips both.','=COUNT({5644;6214;8037;0})'],
  ['','Result: <b>4</b>. The copied-down cells show COUNTA = 5 (every non-empty cell) and COUNTBLANK = 1 (only B5).','=4']],
 alt:[['=COUNTA(B2:B7)','5','Counts "NA" and 0 as well — anything that is not empty.'],['=COUNTBLANK(B2:B7)','1','Only B5. A cell containing ="" also counts as blank.'],['=COUNTA(A2:A7)','6','Count the cities — the classic "how many records?"']],
 qa:[['What is the difference between COUNT and COUNTA?','COUNT counts only numeric values (numbers, dates, times). COUNTA counts every non-empty cell — numbers, text, logical values and errors.'],
     ['Why does COUNT return 0 on a column of names?','Names are text. COUNT ignores text, so use COUNTA to count text entries.'],
     ['Does COUNTBLANK count a cell with a space?','No. A space is a character, so the cell is not blank. It does count cells containing an empty string "" returned by a formula.']],
 co:['Dates are stored as numbers, so COUNT counts them.','!A number typed as text (left-aligned, green triangle) is ignored by COUNT — convert it with VALUE or Paste Special ▸ Multiply by 1.','Quick check without a formula: select the range and read Count / Numerical Count on the status bar.']});

F({n:'COUNTIF', cat:'count', lvl:'B', keys:'criteria wildcard',
 does:'Counts the cells in a range that meet <b>one condition</b>.',
 syn:'COUNTIF(range, criteria)',
 args:[['range','Cells to test'],['criteria','The condition: "High", ">50", "<>High", "P*"']],
 g:[['City','Density','','Density','Cities'],['Guwahati','High','','High',''],['Silchar','Low'],['Jorhat','High'],['Tezpur','Medium'],['Patna','Low'],['Purnia','High']],
 at:'E2', f:'=COUNTIF(B2:B7,D2)', out:'3', ty:'Number',
 steps:[
  ['B2:B7','The <b>range</b> B2:B7 holds the density of each city.','=COUNTIF(B2:B7,D2)'],
  ['B2:B7 D2','The <b>criteria</b> comes from D2: "High". Using a cell instead of typing "High" lets you change it later.','=COUNTIF(B2:B7,"High")'],
  ['B2:B7 !B2 !B4 !B7','Each cell is compared with "High". Guwahati, Jorhat and Purnia match (the test ignores upper/lower case).','=COUNTIF({"High";"Low";"High";"Medium";"Low";"High"},"High")'],
  ['','Three matches, so the result is <b>3</b>.','=3']],
 alt:[['=COUNTIF(B2:B7,"<>High")','3','Not equal to High.'],['=COUNTIF(A2:A7,"P*")','2','Wildcard: cities starting with P (Patna, Purnia). ? = one character.'],['=COUNTIF(B2:B7,"*")','6','Any text at all.'],['=COUNTIF(A:A,A2)>1','FALSE','Classic duplicate check — TRUE when a value appears more than once.']],
 qa:[['How do you count cells greater than a value stored in a cell?','Join the operator and the cell with &: =COUNTIF(C2:C50,">"&F1). Writing ">F1" in quotes would look for the text F1.'],
     ['Is COUNTIF case-sensitive?','No. "HIGH", "high" and "High" all match. For a case-sensitive count use SUMPRODUCT(--EXACT(range,"High")).'],
     ['How do you find duplicates with COUNTIF?','=COUNTIF($A$2:$A$100,A2)>1 returns TRUE for every value that appears more than once; it also works as a conditional-formatting rule.']],
 co:['Criteria with an operator must be in quotes: ">50", "<=100", "<>Done".','!COUNTIF only accepts a range, not an array returned by another function — use SUMPRODUCT or COUNT(FILTER(…)) for those cases.','Wildcards: * any characters, ? one character, ~* a real asterisk.']});

F({n:'COUNTIFS', cat:'count', lvl:'A', keys:'multiple criteria',
 does:'Counts rows that meet <b>several conditions at once</b> (AND logic).',
 syn:'COUNTIFS(criteria_range1, criteria1, [criteria_range2, criteria2], …)',
 args:[['criteria_range1','First column to test'],['criteria1','Condition for that column'],['…','Up to 127 range / criteria pairs']],
 g:[['City','Density','Month','','Result'],['Guwahati','High','Mar'],['Silchar','Low','Mar'],['Jorhat','High','Apr'],['Tezpur','High','Mar'],['Patna','Low','Apr'],['Purnia','High','Apr']],
 at:'E2', f:'=COUNTIFS(B2:B7,"High",C2:C7,"Mar")', out:'2', ty:'Number',
 steps:[
  ['B2:B7','First pair: which rows have Density = "High"?','=COUNTIFS(B2:B7,"High",C2:C7,"Mar")'],
  ['B2:B7 !B2 !B4 !B5 !B7','Rows 2, 4, 5 and 7 pass the first test.','{TRUE;FALSE;TRUE;TRUE;FALSE;TRUE}'],
  ['C2:C7 !C2 !C3 !C5','Second pair: which rows have Month = "Mar"? Rows 2, 3 and 5.','{TRUE;TRUE;FALSE;TRUE;FALSE;FALSE}'],
  ['A2:C2 A5:C5','A row is counted only when <b>both</b> tests are TRUE: Guwahati and Tezpur.','{1;0;0;1;0;0}'],
  ['','1 + 1 = <b>2</b> cities are High density with a March target.','=2']],
 alt:[['=COUNTIFS(C2:C7,"Apr")','3','One pair works like COUNTIF.'],['=COUNTIFS(B2:B7,"High",C2:C7,"<>Mar")','2','Mix = and <> conditions.'],['=SUM(COUNTIFS(B2:B7,{"High","Low"}))','6','OR logic: High OR Low, using an array constant.']],
 qa:[['COUNTIFS uses AND logic. How do you count with OR?','Add two COUNTIFs, or pass an array constant and wrap in SUM: =SUM(COUNTIFS(B:B,{"High","Medium"})).'],
     ['What error do you get if the ranges have different sizes?','#VALUE!. Every criteria range must have the same number of rows and columns.'],
     ['How do you count between two dates?','=COUNTIFS(D:D,">="&F1,D:D,"<="&G1) — the same column used twice with two conditions.']],
 co:['All criteria ranges must be exactly the same size.','Your workbook uses this pattern in Count!O5 for the month × density table.','!Use $ on the ranges ($D:$D) before copying the formula across a summary table.']});

/* ============ SUM ============ */
F({n:'SUM', cat:'sum', lvl:'B', keys:'autosum total add',
 does:'Adds numbers, ranges or both. Text and blank cells are ignored.',
 syn:'SUM(number1, [number2], …)',
 args:[['number1','A number, cell or range'],['[number2]','More values or ranges (up to 255)']],
 g:[['Product','Sales','','Total'],['Cheese',20181],['Butter',26157],['Bread',36478],['Milk',43312]],
 at:'D2', f:'=SUM(B2:B5)', out:'126128', ty:'Number',
 steps:[
  ['B2:B5','Excel collects the numbers in <b>B2:B5</b>.','=SUM(B2:B5)'],
  ['B2:B3','Adds them one by one: 20181 + 26157 = 46338 …','=SUM({20181;26157;36478;43312})'],
  ['B2:B5','… + 36478 + 43312.','=20181+26157+36478+43312'],
  ['','Total sales: <b>126128</b>.','=126128']],
 alt:[['=SUM(B2:B3,B5)','89650','Several separate ranges.'],['=SUM(B:B)','126128','A whole column — convenient, but keep totals out of that column.'],['Alt + =  (⌘⇧T on Mac)','AutoSum','Inserts =SUM() for the block above automatically.']],
 qa:[['What happens if SUM meets a number stored as text?','It is ignored silently, so the total is too small. Watch for left-aligned numbers and the green error triangle.'],
     ['What is the difference between =A1+A2 and =SUM(A1:A2)?','The + operator returns #VALUE! if a cell holds text; SUM simply skips text. SUM is also easier to extend.'],
     ['How do you sum only visible (filtered) rows?','Use SUBTOTAL(9,range) or AGGREGATE(9,5,range) instead of SUM.']],
 co:['Keyboard: Alt + = (Windows) · ⌘ ⇧ T (Mac) inserts AutoSum.','!SUM ignores text; the + operator does not. Choose deliberately.','Select a range and read the Sum on the status bar for a quick check.']});

F({n:'SUMIF', cat:'sum', lvl:'B',
 does:'Adds the values that meet <b>one condition</b>.',
 syn:'SUMIF(range, criteria, [sum_range])',
 args:[['range','Cells tested against the criteria'],['criteria','The condition'],['[sum_range]','Cells to add (defaults to range)']],
 g:[['Product','Month','Sales','','Cheese total'],['Cheese','Jan',20181],['Butter','Jan',26157],['Cheese','Feb',42193],['Butter','Feb',47177],['Cheese','Mar',36810]],
 at:'E2', f:'=SUMIF(A2:A6,"Cheese",C2:C6)', out:'99184', ty:'Number',
 steps:[
  ['A2:A6','The <b>range</b> A2:A6 is checked for "Cheese".','=SUMIF(A2:A6,"Cheese",C2:C6)'],
  ['A2:A6 !A2 !A4 !A6','Rows 2, 4 and 6 match.','{TRUE;FALSE;TRUE;FALSE;TRUE}'],
  ['C2:C6 !C2 !C4 !C6','From the <b>sum_range</b> C2:C6, only the matching rows are picked: 20181, 42193, 36810.','=20181+42193+36810'],
  ['','Cheese sales for the quarter: <b>99184</b>.','=99184']],
 alt:[['=SUMIF(C2:C6,">30000")','126180','No sum_range: tests and adds the same cells.'],['=SUMIF(B2:B6,"Jan",C2:C6)','46338','Month-wise total (your Sum!L5).']],
 qa:[['What if sum_range is a different size from range?','Excel resizes sum_range to match range starting from its top-left cell — a silent source of wrong totals. Keep them identical.'],
     ['Where does sum_range go in SUMIF vs SUMIFS?','Last in SUMIF, first in SUMIFS — a favourite interview trap.']],
 co:['Criteria accept wildcards: "Che*".','!Keep range and sum_range the same size; Excel does not warn you.']});

F({n:'SUMIFS', cat:'sum', lvl:'A',
 does:'Adds values that meet <b>several conditions</b> (AND logic).',
 syn:'SUMIFS(sum_range, criteria_range1, criteria1, …)',
 args:[['sum_range','Cells to add — FIRST argument'],['criteria_range1, criteria1','Pairs of range + condition']],
 g:[['Product','Month','Sales','','Butter · Feb'],['Cheese','Jan',20181],['Butter','Jan',26157],['Cheese','Feb',42193],['Butter','Feb',47177],['Cheese','Mar',36810]],
 at:'E2', f:'=SUMIFS(C2:C6,A2:A6,"Butter",B2:B6,"Feb")', out:'47177', ty:'Number',
 steps:[
  ['C2:C6','SUMIFS starts with the <b>sum_range</b> C2:C6.','=SUMIFS(C2:C6,A2:A6,"Butter",B2:B6,"Feb")'],
  ['A2:A6 !A3 !A5','Condition 1: Product = "Butter" → rows 3 and 5.','{0;1;0;1;0}'],
  ['B2:B6 !B4 !B5','Condition 2: Month = "Feb" → rows 4 and 5.','{0;0;1;1;0}'],
  ['C5 !C5','Only row 5 passes both, so only C5 is added.','=47177'],
  ['','Butter sales in February: <b>47177</b>.','=47177']],
 alt:[['=SUMIFS(C2:C6,A2:A6,"Cheese",B2:B6,"<>Jan")','79003','Cheese, excluding January.'],['=SUMIFS($C:$C,$A:$A,$E5,$B:$B,F$4)','—','Mixed references build a product × month grid in one copy (your Sum sheet).']],
 qa:[['Why prefer SUMIFS even for one condition?','Its argument order stays the same however many conditions you add, so formulas are easier to extend and audit.'],
     ['How do you sum between two dates?','=SUMIFS(Sales,Date,">="&Start,Date,"<="&End).']],
 co:['sum_range comes first — the opposite of SUMIF.','!All ranges must be the same size, otherwise #VALUE!.']});

/* ============ AVERAGE ============ */
F({n:'AVERAGE', cat:'avg', lvl:'B', keys:'mean',
 does:'Returns the arithmetic mean: total ÷ count of numbers.',
 syn:'AVERAGE(number1, [number2], …)',
 g:[['Student','Score','','Average'],['Satish',25],['Sridhar',88],['Mallesh',48],['Bhanu',37],['Sireesha',61]],
 at:'D2', f:'=AVERAGE(B2:B6)', out:'51.8', ty:'Number',
 steps:[
  ['B2:B6','Excel takes the five scores in <b>B2:B6</b>.','=AVERAGE(B2:B6)'],
  ['B2:B6','Adds them: 25 + 88 + 48 + 37 + 61 = 259.','=259/COUNT(B2:B6)'],
  ['B2:B6','Counts the numbers: 5.','=259/5'],
  ['','259 ÷ 5 = <b>51.8</b>.','=51.8']],
 alt:[['=AVERAGE(B2:B6,100)','59.83','Extra values can be added.'],['=AVERAGEA(B2:B6)','51.8','AVERAGEA also counts text as 0 and TRUE as 1.']],
 qa:[['Does AVERAGE include zeros and blanks?','Zeros yes, blanks no. A blank cell does not change the average; a 0 pulls it down.'],
     ['Mean vs median — when is median better?','When data has extreme values (salaries, house prices). The median is the middle value and is not dragged by outliers.']],
 co:['!Blank ≠ zero: a 0 typed for "not taken" lowers the average.','For outliers, compare with MEDIAN (Statistical section).']});

F({n:'AVERAGEIF', cat:'avg', lvl:'B',
 does:'Averages the values that meet <b>one condition</b>.',
 syn:'AVERAGEIF(range, criteria, [average_range])',
 g:[['Student','Class','Score','','Class A avg'],['Satish','A',25],['Sridhar','B',88],['Mallesh','A',48],['Bhanu','B',37],['Sireesha','A',61]],
 at:'E2', f:'=AVERAGEIF(B2:B6,"A",C2:C6)', out:'44.67', ty:'Number (formatted to 2 decimals)',
 steps:[
  ['B2:B6','Which students are in class "A"?','=AVERAGEIF(B2:B6,"A",C2:C6)'],
  ['B2:B6 !B2 !B4 !B6','Rows 2, 4 and 6.','{TRUE;FALSE;TRUE;FALSE;TRUE}'],
  ['C2:C6 !C2 !C4 !C6','Their scores: 25, 48, 61 → total 134.','=(25+48+61)/3'],
  ['','134 ÷ 3 = <b>44.67</b>.','=44.6667']],
 alt:[['=AVERAGEIF(C2:C6,">40")','65.67','Average of scores above 40.'],['=IFERROR(AVERAGEIF(B2:B6,"C",C2:C6),0)','0','No class C → #DIV/0!, caught by IFERROR.']],
 qa:[['What does AVERAGEIF return when nothing matches?','#DIV/0!, because it divides by a count of zero. Wrap it in IFERROR.']],
 co:['!No matches → #DIV/0!.','Like SUMIF, the range to average comes last.']});

F({n:'AVERAGEIFS', cat:'avg', lvl:'A',
 does:'Averages values that meet <b>several conditions</b>.',
 syn:'AVERAGEIFS(average_range, criteria_range1, criteria1, …)',
 g:[['Student','Class','Score','','A & >30'],['Satish','A',25],['Sridhar','B',88],['Mallesh','A',48],['Bhanu','B',37],['Sireesha','A',61]],
 at:'E2', f:'=AVERAGEIFS(C2:C6,B2:B6,"A",C2:C6,">30")', out:'54.5', ty:'Number',
 steps:[
  ['C2:C6','average_range comes <b>first</b>: C2:C6.','=AVERAGEIFS(C2:C6,B2:B6,"A",C2:C6,">30")'],
  ['B2:B6 !B2 !B4 !B6','Condition 1: Class = "A" → rows 2, 4, 6.','{1;0;1;0;1}'],
  ['C2:C6 !C3 !C4 !C5 !C6','Condition 2: Score > 30 → rows 3–6 (Satish scored 25).','{0;1;1;1;1}'],
  ['C4 C6','Both true: Mallesh 48 and Sireesha 61.','=(48+61)/2'],
  ['','<b>54.5</b>','=54.5']],
 qa:[['Can the same column be both a criteria range and the average range?','Yes — here C2:C6 is averaged and also tested for >30.']],
 co:['The same range can appear twice with different conditions (between two values).']});

/* ============ LOGICAL ============ */
F({n:'IF', cat:'logic', lvl:'B',
 does:'Tests a condition and returns one value if TRUE, another if FALSE.',
 syn:'IF(logical_test, value_if_true, [value_if_false])',
 args:[['logical_test','Anything that is TRUE or FALSE: B2>=35'],['value_if_true','Result when TRUE'],['value_if_false','Result when FALSE']],
 g:[['Student','English','Status'],['Satish',25,''],['Sridhar',88],['Mallesh',48]],
 at:'C2', f:'=IF(B2>=35,"Pass","Fail")', out:'Fail', ty:'Text', fill:{C3:'Pass',C4:'Pass'},
 steps:[
  ['B2','Read the value in <b>B2</b>: 25.','=IF(25>=35,"Pass","Fail")'],
  ['B2','Evaluate the test: is 25 ≥ 35? <b>FALSE</b>.','=IF(FALSE,"Pass","Fail")'],
  ['','FALSE → Excel returns the third argument, <b>"Fail"</b>. Copied down, Sridhar and Mallesh get "Pass".','="Fail"']],
 alt:[['=IF(B2="","Absent",IF(B2>=35,"Pass","Fail"))','Fail','Handle blanks first.'],['=IF(B2>=35,1,0)','0','Return numbers to sum later.']],
 qa:[['What does IF return if value_if_false is omitted and the test is FALSE?','The logical value FALSE.'],
     ['How do you test for an empty cell?','=IF(A1="", …) or =IF(ISBLANK(A1), …). A1="" also treats a formula returning "" as empty.'],
     ['How many IFs can be nested?','64 — but more than three usually means IFS, a lookup table or SWITCH is a better choice.']],
 co:['Text results need quotes; numbers do not.','!=IF(B2>=35,"Pass") with no third argument shows FALSE for failures.','Your workbook: IF (And, Or) sheet, column F.']});

F({n:'AND · OR', cat:'logic', lvl:'B', keys:'and or logical',
 does:'AND is TRUE only when <b>all</b> tests are TRUE. OR is TRUE when <b>any</b> test is TRUE.',
 syn:'AND(logical1, [logical2], …) | OR(logical1, [logical2], …)',
 g:[['Student','English','Maths','Both ≥35?','Any ≥35?'],['Satish',25,82,'','']],
 at:'D2', f:'=AND(B2>=35,C2>=35)', out:'FALSE', ty:'Logical', fill:{E2:'TRUE'},
 steps:[
  ['B2','Test 1: English 25 ≥ 35 → <b>FALSE</b>.','=AND(FALSE,C2>=35)'],
  ['C2','Test 2: Maths 82 ≥ 35 → <b>TRUE</b>.','=AND(FALSE,TRUE)'],
  ['','AND needs every test TRUE → <b>FALSE</b>. OR in E2 needs just one → TRUE.','=FALSE']],
 alt:[['=OR(B2>=35,C2>=35)','TRUE','Any one condition.'],['=IF(AND(B2>=35,C2>=35),"Pass","Fail")','Fail','Most common use: inside IF.'],['=(B2>=35)*(C2>=35)','0','Array-friendly AND: TRUE×TRUE = 1.']],
 qa:[['How do you write "pass in all subjects" with OR?','Check for any failure and invert: =IF(OR(B2<35,C2<35),"Fail","Pass") — this is what your IF sheet does.'],
     ['What is XOR?','TRUE when an odd number of tests are TRUE — for two tests, exactly one.']],
 co:['Multiply for AND and add for OR inside array formulas: (A)*(B), (A)+(B).','!AND/OR return a single value — they do not work row-by-row inside FILTER; use * and + there.']});

F({n:'Nested IF', cat:'logic', lvl:'A', keys:'grade',
 does:'One IF inside another to handle more than two outcomes. Conditions are checked in order; the first TRUE wins.',
 syn:'IF(test1, value1, IF(test2, value2, IF(test3, value3, else)))',
 g:[['Student','Percent','Grade'],['Mallesh',76,'']],
 at:'C2', f:'=IF(B2>=90,"A+",IF(B2>=75,"A",IF(B2>=60,"B","C")))', out:'A', ty:'Text',
 steps:[
  ['B2','First test: 76 ≥ 90? <b>FALSE</b> → move to the inner IF.','=IF(FALSE,"A+",IF(B2>=75,"A",…))'],
  ['B2','Second test: 76 ≥ 75? <b>TRUE</b>.','=IF(TRUE,"A",IF(B2>=60,"B","C"))'],
  ['','The first TRUE wins, so the remaining tests are never checked. Result <b>"A"</b>.','="A"']],
 alt:[['=IFS(B2>=90,"A+",B2>=75,"A",B2>=60,"B",TRUE,"C")','A','Same logic, flatter (Excel 2019+).'],['=LOOKUP(B2,{0,60,75,90},{"C","B","A","A+"})','A','A lookup band is easiest to maintain.']],
 qa:[['Why must you start from the highest band?','If you test B2>=60 first, a 95 would stop there and get "B".'],
     ['What is a cleaner alternative to deep nesting?','IFS, SWITCH, or an approximate-match lookup against a small band table.']],
 co:['!Order matters: highest threshold first when using ≥.','Count the closing brackets — one per IF.']});

F({n:'IFS', cat:'logic', lvl:'A', keys:'ifs switch',

 steps:[
  ['B2','Pair 1: 76 ≥ 90 → FALSE.','=IFS(FALSE,"A+",B2>=75,"A",…)'],
  ['B2','Pair 2: 76 ≥ 75 → TRUE.','=IFS(FALSE,"A+",TRUE,"A",…)'],
  ['','Returns the value paired with the first TRUE: <b>"A"</b>.','="A"']],

F({n:'IFERROR', cat:'logic', lvl:'A',

/* ============ LOOKUP ============ */
F({n:'VLOOKUP (exact)', cat:'lookup', lvl:'B', keys:'vlookup lookup',
 does:'Searches the <b>first column</b> of a table and returns a value from a column to the right.',
 syn:'VLOOKUP(lookup_value, table_array, col_index_num, [range_lookup])',
 args:[['lookup_value','What to find'],['table_array','The table; lookup column must be first'],['col_index_num','Which column to return (1 = first)'],['range_lookup','0 / FALSE = exact, 1 / TRUE = approximate']],
 g:[['Client-ID','Name','Age','','Find','Name'],['MSE001','Bharath',20,'','MSE003',''],['MSE002','Jyothsna',19],['MSE003','Bhanu',16],['MSE004','Gopi',24]],
 at:'F2', f:'=VLOOKUP(E2,A2:C5,2,0)', out:'Bhanu', ty:'Text',
 steps:[
  ['E2','<b>lookup_value</b>: "MSE003" from E2.','=VLOOKUP("MSE003",A2:C5,2,0)'],
  ['A2:C5','<b>table_array</b> A2:C5. VLOOKUP only searches its first column (A).','=VLOOKUP("MSE003",A2:C5,2,0)'],
  ['A2:A5 A2~g A3~g !A4','Exact match (0): Excel scans A2, A3 … and finds MSE003 in the 3rd row of the table.','row 3 of the table'],
  ['B4 !B4','<b>col_index_num</b> 2 = the 2nd column of the table (Name). Row 3, column 2 is B4.','=INDEX(A2:C5,3,2)'],
  ['','Result: <b>Bhanu</b>.','="Bhanu"']],
 alt:[['=VLOOKUP(E2,$A$2:$C$5,3,FALSE)','16','Age — lock the table with $ before copying.'],['=VLOOKUP(E2,A:C,{2,3},0)','Bhanu | 16','Array constant returns two columns (your "flower brackets" note).']],
 qa:[['Why does VLOOKUP return #N/A even though the value exists?','Usual causes: extra spaces (use TRIM), number stored as text vs real number, or approximate match on unsorted data.'],
     ['Can VLOOKUP look to the left?','No. The lookup column must be the first column of the table. Use INDEX/MATCH or XLOOKUP.'],
     ['What happens when you insert a column inside the table?','The hard-coded col_index_num now points to the wrong column. MATCH or XLOOKUP avoid this.']],
 co:['!Always type 0 / FALSE for exact match — the default is approximate.','×Duplicates: VLOOKUP returns only the first match.','Lock the table with F4 ($A$2:$C$5) before copying.']});

F({n:'VLOOKUP (approximate)', cat:'lookup', lvl:'A', keys:'band slab range_lookup true',
 does:'With range_lookup = 1, VLOOKUP finds the <b>largest value ≤ lookup_value</b> — perfect for bands, slabs and grades.',
 syn:'VLOOKUP(lookup_value, table_array, col_index_num, TRUE)',
 g:[['From age','Category','','Age','Category'],[0,'Child','',17,''],[13,'Teen'],[20,'Adult'],[60,'Senior']],
 at:'E2', f:'=VLOOKUP(D2,A2:B5,2,1)', out:'Teen', ty:'Text',
 steps:[
  ['D2','Look up age <b>17</b>.','=VLOOKUP(17,A2:B5,2,1)'],
  ['A2:A5 A2~g !A3 A4~g','The first column must be sorted ascending. 13 ≤ 17 but 20 > 17, so Excel stops at <b>13</b>.','largest value ≤ 17 → 13'],
  ['B3','Column 2 of that row: <b>Teen</b>.','="Teen"'],
  ['','<b>Teen</b>','="Teen"']],
 qa:[['What must be true of the table for approximate match?','The first column must be sorted smallest to largest, otherwise results are wrong without any error.'],
     ['Give a real use case.','Tax slabs, commission tiers, grade bands, shipping-weight rates.']],
 co:['!Unsorted data gives wrong answers silently.','Your Lookup sheet D15:E22 uses this for age categories.']});

F({n:'HLOOKUP', cat:'lookup', lvl:'B',

 syn:'HLOOKUP(lookup_value, table_array, row_index_num, [range_lookup])',
 g:[['Month','Jan','Feb','Mar'],['Sales',45200,38900,51750],['Target',45000,42000,50000],['',''],['Feb sales','']],
 at:'B5', f:'=HLOOKUP("Feb",A1:D3,2,0)', out:'38900', ty:'Number', hdr:false,
 steps:[
  ['A1:D3','Table A1:D3 — months run across row 1.','=HLOOKUP("Feb",A1:D3,2,0)'],
  ['A1:D1 B1~g !C1','Scan row 1 for "Feb" → column C.','column C'],
  ['C2 !C2','row_index_num 2 = Sales row → C2.','=38900'],

F({n:'XLOOKUP', cat:'lookup', lvl:'M', keys:'xlookup left lookup not found',
 does:'Modern lookup: any direction, exact match by default, built-in "not found" and last-match search.',

 args:[['lookup_array','One column (or row) to search'],['return_array','Column to return — can be LEFT of lookup_array'],['[if_not_found]','Your message instead of #N/A'],['[search_mode]','1 first-to-last, -1 last-to-first']],
 g:[['Client-ID','Name','Age','','Find','Client-ID'],['MSE001','Bharath',20,'','Gopi',''],['MSE002','Jyothsna',19],['MSE003','Bhanu',16],['MSE004','Gopi',24]],
 at:'F2', f:'=XLOOKUP(E2,B2:B5,A2:A5,"Not found")', out:'MSE004', ty:'Text',
 steps:[
  ['E2','Find the name <b>"Gopi"</b>.','=XLOOKUP("Gopi",B2:B5,A2:A5,"Not found")'],
  ['B2:B5 B2~g B3~g B4~g !B5','Search <b>lookup_array</b> B2:B5 — the Name column. Match in position 4.','position 4'],

     ['Which Excel versions have XLOOKUP?','Microsoft 365, Excel 2021 and 2024, Excel for the web. Older versions show #NAME?.']],
 co:['!Files shared with Excel 2019 users show #NAME? — use INDEX/MATCH there.','Default is exact match, unlike VLOOKUP.']});

F({n:'INDEX + MATCH', cat:'lookup', lvl:'A', keys:'index match two way',

 syn:'INDEX(array, row_num, [column_num]) | MATCH(lookup_value, lookup_array, [match_type])',

 steps:[
  ['A2:A4 A2~g !A3','MATCH("Gopi", A2:A4, 0) → Gopi is the <b>2nd</b> name.','=INDEX(B2:D4,2,MATCH("Physics",B1:D1,0))'],
  ['B1:D1 B1~g !C1','MATCH("Physics", B1:D1, 0) → Physics is the <b>2nd</b> subject.','=INDEX(B2:D4,2,2)'],
  ['B2:D4 !C3','INDEX goes to row 2, column 2 of B2:D4 → C3.','=62'],
  ['','<b>62</b> — change either name and the answer follows.','=62']],
 alt:[['=MATCH("Gopi",A2:A4,0)','2','Position only.'],['=INDEX(B2:B4,3)','58','3rd value of Maths.']],

     ['What does match_type 0, 1 and -1 mean?','0 exact; 1 largest ≤ value (ascending data); -1 smallest ≥ value (descending data).']],

F({n:'INT · ABS', cat:'num', lvl:'B', keys:'int abs absolute integer',

F({n:'LARGE · SMALL', cat:'num', lvl:'B', keys:'large small top nth',

<script>
/* ---------- Cell helpers ---------- */
const colNum = s => s.split('').reduce((n,ch)=>n*26+ch.charCodeAt(0)-64,0);
const colLet = n => { let s=''; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26);} return s; };
function parseRef(ref){
  ref = ref.replace(/\$/g,'');
  const [a,b] = ref.split(':');
  const p = x => { const m=x.match(/^([A-Z]+)(\d+)$/); return {c:colNum(m[1]), r:+m[2]}; };
  const A=p(a), B=b?p(b):A;
  return {c1:Math.min(A.c,B.c), r1:Math.min(A.r,B.r), c2:Math.max(A.c,B.c), r2:Math.max(A.r,B.r)};
}
const REF_RE = /(?<![A-Za-z_"])\$?[A-Z]{1,2}\$?\d+(?::\$?[A-Z]{1,2}\$?\d+)?(?![\w(])/g;
const COLORS=['o','n','g'];
function refColors(f){
  const map={}; let i=0;
  (f.replace(/"[^"]*"/g,'""').match(REF_RE)||[]).forEach(r=>{ const k=r.replace(/\$/g,''); if(!(k in map)) map[k]=COLORS[i++%3]; });
  return map;
}
function colorFormula(f){
  const map=refColors(f); let out=''; let last=0;
  // skip refs inside quotes
  const parts=f.split(/("[^"]*")/);
  return parts.map(p=>{
    if(p.startsWith('"')) return esc(p);
    return esc(p).replace(REF_RE, r=>{ const k=r.replace(/\$/g,''); return map[k]?`<span class="r-${map[k]}">${r}</span>`:r; });
  }).join('');
}
function fmtSyn(syn){
  const m=syn.match(/^([A-Z0-9_.]+)\((.*)\)$/);
  if(!m) return esc(syn);
  const args=m[2].split(/,\s*/).filter(Boolean).map(a=> a.startsWith('[')?`<span class="opt">${esc(a)}</span>`:`<span class="arg">${esc(a)}</span>`);
  return `<span class="fn">${m[1]}</span>(${args.join(', ')})`;
}

/* ---------- State ---------- */
let cur=null, curEntry=null, pi=0, step=0, timer=null, speed=2600;
const isNum = v => typeof v==='number' || (/^-?[\d,]*\.?\d+%?$/.test(String(v)) && String(v)!=='' && !/^0\d/.test(String(v)));

function stepsOf(e){ return e.steps||[]; }

function renderFunction(e){
  $('body').classList.remove('page-mode');
  $('catHint').textContent = (CATS.find(c=>c.id===e.cat)||{}).name||'';
  const lvlName = {B:'Basic',A:'Advanced',M:'Microsoft 365'}[e.lvl];
  const argHtml = (e.args||[]).map(([a,d])=>`<div><code>${esc(a)}</code><span>${d}</span></div>`).join('');
  $('formula').innerHTML = `
    <div class="fname"><h2>${esc(e.n)}</h2><span class="badge ${e.lvl}">${lvlName}</span></div>
    <div class="does">${e.does}</div>
    ${tabsHTML()}
    <div class="fbar"><span class="nm">${e.at}</span><span class="fx">fx</span><span class="ftxt">${colorFormula(e.f)}</span></div>
    <div class="syn">${synHTML(e)}</div>
    ${argHtml?`<div class="args">${argHtml}</div>`:''}`;
  $('qa').innerHTML = `<div class="qa">${(e.qa||[]).map(([q,a])=>`<details class="q"><summary>${q}</summary><div class="a">${a}</div></details>`).join('')}</div>`;
  $('co').innerHTML = `<ul class="co">${(e.co||[]).map(c=>{ const cls=c.startsWith('!')?'warn':c.startsWith('×')?'err':''; return `<li class="${cls}">${c.replace(/^[!×]/,'')}</li>`; }).join('')}</ul>`;
  $('steps').innerHTML = `<ol class="steps">${stepsOf(e).map((s,i)=>`<li data-i="${i+1}"><div>${s[1]}${s[2]?`<code class="ev">${esc(s[2])}</code>`:''}</div></li>`).join('')}</ol>`;
  $('steps').querySelectorAll('li').forEach(li=>li.addEventListener('click',()=>{ stop(); go(+li.dataset.i); }));
  $('formula').querySelectorAll('.ptabs button').forEach(b=>b.addEventListener('click',()=>{ stop(); selectPart(+b.dataset.pi); }));
  go(0);
}
function tabsHTML(){
  const P=curEntry.parts; if(P.length<2) return '';
  return `<div class="ptabs" role="tablist" aria-label="Functions in this lesson">${P.map((p,i)=>`<button role="tab" data-pi="${i}" aria-selected="${i===pi}"><span class="n">${i+1}</span>${esc(p.t)}</button>`).join('')}</div>${cur.d?`<div class="pdesc">${cur.d}</div>`:''}`;
}
function synHTML(e){
  const lines=e.syn.split(' | '); const P=curEntry.parts;
  const words=new Set(String(e.t).toUpperCase().split(/[^A-Z.]+/).filter(Boolean));
  const names=lines.map(l=>(l.match(/^([A-Z0-9_.]+)\(/)||[])[1]);
  const any=P.length>1 && names.some(n=>words.has(n));
  return lines.map((l,i)=>`<span class="${any && !words.has(names[i])?'dim':''}">${fmtSyn(l)}</span>`).join('<br>');
}
function selectPart(i){ pi=i; cur=curEntry.parts[i]; renderFunction(cur); }

function outHTML(e, done){
  if(!done) return `<div class="lbl">Result</div><div class="val wait">Press ▶ to evaluate</div>`;
  let v;
  if(Array.isArray(e.out)) v=`<table>${e.out.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table>`;
  else v=`<div class="val ${String(e.out).startsWith('#')?'err':''}">${esc(e.out)}</div>`;
  return `<div class="lbl">Result in ${e.at}</div>${v}${e.ty?`<div class="ty">${e.ty}</div>`:''}`;
}

function renderSheet(e){
  const S=stepsOf(e), n=S.length, done = step>=n;
  const s = step>0 ? S[step-1] : null;
  const g=e.g, rows=g.length; let cols=0; g.forEach(r=>cols=Math.max(cols,r.length));
  const atP=parseRef(e.at);
  let spill=null;
  if(Array.isArray(e.out)){ spill={r1:atP.r1,c1:atP.c1,r2:atP.r1+e.out.length-1,c2:atP.c1+e.out[0].length-1}; cols=Math.max(cols,spill.c2); }
  cols=Math.max(cols,atP.c1);
  const nRows=Math.max(rows, atP.r1, spill?spill.r2:0);
  const hits=new Set(); const tokens=[];
  if(s && s[0]) s[0].split(' ').forEach(t=>{ if(!t) return; if(t.startsWith('!')) hits.add(t.slice(1)); else if(!t.startsWith('c')||/^c[A-Z]/.test(t)&&false) tokens.push(t); });
  let h=`<div class="gridbox" id="gridbox"><table class="grid" id="grid"><tr><th class="rn"></th>`;
  for(let c=1;c<=cols;c++) h+=`<th>${colLet(c)}</th>`;
  h+='</tr>';
  for(let r=1;r<=nRows;r++){
    const hid=(e.hid||[]).includes(r);
    h+=`<tr${hid?' class="hid"':''}><th class="rn">${r}</th>`;
    for(let c=1;c<=cols;c++){
      const ref=colLet(c)+r;
      let v=(g[r-1]||[])[c-1]; v = v===undefined?'':v;
      const cls=[];
      if(r===1 && e.hdr!==false && v!=='') cls.push('hdr');
      if(ref===e.at){ cls.push('res'); if(!done){ cls.push('pending'); v = s&&s[3]!==undefined ? s[3] : e.f.length>22? e.f.slice(0,20)+'…' : e.f; } else v = Array.isArray(e.out)? e.out[0][0] : e.out; if(done && String(v).startsWith('#')) cls.push('err'); }
      else if(spill && done && r>=spill.r1&&r<=spill.r2&&c>=spill.c1&&c<=spill.c2){ v=e.out[r-spill.r1][c-spill.c1]; cls.push('spill'); }
      else if(e.fill && ref in e.fill && done){ v=e.fill[ref]; cls.push('copied'); }
      if(hits.has(ref)) cls.push('hit');
      if(v!=='' && isNum(v) && !cls.includes('hdr')) cls.push('num');
      h+=`<td class="${cls.join(' ')}" data-ref="${ref}">${esc(v)}</td>`;
    }
    h+='</tr>';
  }
  h+='</table></div>';
  if(e.chars){
    const on=new Set(), mk=new Set();
    if(s && s[0]) s[0].split(' ').forEach(t=>{ const m=t.match(/^(c|m)(\d+)(?:-(\d+))?$/); if(m){ for(let i=+m[2];i<=+(m[3]||m[2]);i++) (m[1]==='c'?on:mk).add(i); }});
    h+=`<div class="chars" aria-label="Characters and positions">${[...e.chars].map((ch,i)=>`<span class="${on.has(i+1)?'on':mk.has(i+1)?'mk':''}"><b>${ch===' '?'␣':esc(ch)}</b><i>${i+1}</i></span>`).join('')}</div>`;
  }
  const intro = e.intro || `The formula <code>${esc(e.f)}</code> is typed in <b>${e.at}</b>. Press ▶ or the → key to evaluate it one step at a time.`;
  h+=`<div class="caption" aria-live="polite">${s? s[1] : intro}</div>`;
  $('sheet').innerHTML=h;
  cur._tokens = tokens.filter(t=>/^\$?[A-Z]{1,2}\$?\d+(:\$?[A-Z]{1,2}\$?\d+)?(~[ong])?$/.test(t));
  cur._spill = done && spill ? spill : null;
  drawHL();
}

function drawHL(){
  const box=$('gridbox'); if(!box||!cur) return;
  box.querySelectorAll('.hl').forEach(x=>x.remove());
  const map=refColors(cur.f); let k=0;
  const boxR=box.getBoundingClientRect();
  const place=(p,cls)=>{
    const a=box.querySelector(`[data-ref="${colLet(p.c1)}${p.r1}"]`), b=box.querySelector(`[data-ref="${colLet(p.c2)}${p.r2}"]`);
    if(!a||!b) return;
    const ra=a.getBoundingClientRect(), rb=b.getBoundingClientRect();
    const d=document.createElement('div'); d.className='hl '+cls;
    d.style.left=(ra.left-boxR.left+box.scrollLeft-1)+'px'; d.style.top=(ra.top-boxR.top-1)+'px';
    d.style.width=(rb.right-ra.left+2)+'px'; d.style.height=(rb.bottom-ra.top+2)+'px';
    box.appendChild(d);
  };
  (cur._tokens||[]).forEach(t=>{
    let [ref,col]=t.split('~'); const key=ref.replace(/\$/g,'');
    place(parseRef(ref), col || map[key] || COLORS[k++%3]);
  });
  if(cur._spill) place(cur._spill,'sp');
}
addEventListener('resize',()=>requestAnimationFrame(drawHL));

function go(i){
  const e=cur, n=stepsOf(e).length;
  step=Math.max(0,Math.min(n,i));
  renderSheet(e);
  $('output').innerHTML = `<div class="out-card">${outHTML(e, step>=n)}</div>` + altsHTML(e);
  $('steps').querySelectorAll('li').forEach(li=>{ const k=+li.dataset.i; li.className = k<step?'done':k===step?'cur':''; });
  const curLi=$('steps').querySelector('li.cur'); if(curLi) curLi.scrollIntoView({block:'nearest',behavior:'smooth'});
  const multi=curEntry && curEntry.parts.length>1;
  $('stepCount').textContent = `${step} / ${n}`; $('stepCount').title = multi ? `${cur.t}: step ${step} of ${n}` : '';
  $('prevBtn').disabled = step===0 && !(multi && pi>0); $('nextBtn').disabled = step===n && !(multi && pi<curEntry.parts.length-1);
}
function altsHTML(e){
  if(!e.alt||!e.alt.length) return '';
  return `<div class="alts"><h3>More ways to use it</h3>${e.alt.map(([f,o,p])=>`<div class="alt"><code>${esc(f)}</code><span class="ar">→ ${esc(o)}</span>${p?`<p>${p}</p>`:''}</div>`).join('')}</div>`;
}
function advance(){
  if(!cur) return false;
  if(step<stepsOf(cur).length){ go(step+1); return true; }
  if(pi<curEntry.parts.length-1){ selectPart(pi+1); return true; }
  return false;
}
function retreat(){
  if(!cur) return;
  if(step>0) return go(step-1);
  if(pi>0){ selectPart(pi-1); go(stepsOf(cur).length); }
}
function play(){
  if(!cur) return;
  if(step>=stepsOf(cur).length && pi===curEntry.parts.length-1){ if(curEntry.parts.length>1) selectPart(0); else go(0); }
  timer=setInterval(()=>{ if(!advance()) stop(); }, speed);
  $('playBtn').innerHTML=PAUSE; $('playBtn').setAttribute('aria-label','Pause'); advance();
}
function stop(){ clearInterval(timer); timer=null; $('playBtn').innerHTML=PLAY; $('playBtn').setAttribute('aria-label','Play'); }
$('playBtn').innerHTML=PLAY;
$('playBtn').addEventListener('click',()=> timer?stop():play());
$('prevBtn').addEventListener('click',()=>{ stop(); retreat(); });
$('nextBtn').addEventListener('click',()=>{ stop(); advance(); });
document.querySelectorAll('.speed button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.speed button').forEach(x=>x.setAttribute('aria-pressed','false'));
  b.setAttribute('aria-pressed','true'); speed=+b.dataset.ms; if(timer){ stop(); play(); }
}));

/* ---------- Navigation ---------- */
const CHEV='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>';
function buildNav(){
  let h='<div class="group-label">Functions with live examples</div>', seenPages=false;
  CATS.forEach(c=>{
    if(c.type==='page' && !seenPages){ h+='<div class="group-label">Guides</div>'; seenPages=true; }
    if(c.type==='page'){
      h+=`<div class="cat" data-cat="${c.id}"><button class="sec gp" data-page="${c.id}"><span class="sec-text"><b>${c.name}</b>${c.sub}</span></button></div>`;
    } else {
      const items=FN.filter(f=>f.cat===c.id);
      h+=`<div class="cat" data-cat="${c.id}"><button class="sec" aria-expanded="false"><span class="sec-text"><b>${c.name}</b>${c.sub}</span><span class="count">${items.length}</span>${CHEV}</button>
      <ul class="items" hidden>${items.map(f=>`<li><button data-f="${f.id}" data-s="${esc((f.n+' '+(f.keys||'')+' '+c.name).toLowerCase())}">${esc(f.n)}<span class="lv">${f.lvl==='M'?'365':f.lvl==='A'?'Adv':''}</span></button></li>`).join('')}</ul></div>`;
    }
  });
  $('nav').innerHTML=h;
  $('totalHint').textContent = FN.length+' examples';
  $('nav').querySelectorAll('.sec:not(.gp)').forEach(b=>b.addEventListener('click',()=>{
    const open=b.getAttribute('aria-expanded')==='true';
    if(!open && !$('search').value.trim()) collapseAll();
    b.setAttribute('aria-expanded',!open); b.nextElementSibling.hidden=open;
  }));
  $('nav').querySelectorAll('[data-f]').forEach(b=>b.addEventListener('click',()=>openFn(b.dataset.f)));
  $('nav').querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>openPage(b.dataset.page)));
}
function collapseAll(){
  $('nav').querySelectorAll('.sec:not(.gp)').forEach(x=>{ x.setAttribute('aria-expanded','false'); x.nextElementSibling.hidden=true; });
}
function markNav(sel){
  $('nav').querySelectorAll('[aria-current]').forEach(x=>x.removeAttribute('aria-current'));
  const el=$('nav').querySelector(sel); if(el){ el.setAttribute('aria-current','true');
    const cat=el.closest('.cat'); const sec=cat.querySelector('.sec:not(.gp)');
    if(!$('search').value) $('nav').querySelectorAll('.cat').forEach(c=>{ if(c!==cat){ const s2=c.querySelector('.sec:not(.gp)'); if(s2){ s2.setAttribute('aria-expanded','false'); s2.nextElementSibling.hidden=true; } } });
    if(sec && sec.getAttribute('aria-expanded')!=='true'){ sec.setAttribute('aria-expanded','true'); sec.nextElementSibling.hidden=false; }
    el.scrollIntoView({block:'nearest'}); }
}
function openFn(id){
  stop(); curEntry=FN.find(f=>f.id===id); markNav(`[data-f="${id}"]`); selectPart(0);
  if(innerWidth<1100 && document.readyState==='complete') $('body').scrollIntoView({behavior:'smooth'});
}
function openPage(id){
  stop(); cur=null; curEntry=null; markNav(`[data-page="${id}"]`);
  $('body').classList.add('page-mode');
  $('page').innerHTML = `<div class="page">${PAGES[id]()}</div>`; $('page').scrollTop=0;
  if(innerWidth<1100 && document.readyState==='complete') $('body').scrollIntoView({behavior:'smooth'});
  if(PAGES[id+'_after']) PAGES[id+'_after']();
}
function openFnByName(name){ const f=FN.find(x=>x.n===name); if(f) openFn(f.id); }

/* ---------- Search ---------- */
$('search').addEventListener('input',()=>{
  const q=$('search').value.trim().toLowerCase(); let any=false;
  $('nav').querySelectorAll('.cat').forEach(cat=>{
    const pageBtn=cat.querySelector('[data-page]');
    if(pageBtn){ const hit=!q||pageBtn.textContent.toLowerCase().includes(q); cat.hidden=!hit; any=any||hit; return; }
    let n=0; cat.querySelectorAll('[data-f]').forEach(b=>{ const hit=!q||b.dataset.s.includes(q); b.parentElement.hidden=!hit; if(hit) n++; });
    cat.hidden = n===0; any=any||n>0;
    const sec=cat.querySelector('.sec'); if(q && n){ sec.setAttribute('aria-expanded','true'); sec.nextElementSibling.hidden=false; }
  });
  $('nomatch').hidden=any;
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='/' && document.activeElement!==$('search')){ ev.preventDefault(); $('search').focus(); return; }
  if(document.activeElement===$('search')) return;
  if(!cur) return;
  if(ev.key==='ArrowRight'){ stop(); advance(); } else if(ev.key==='ArrowLeft'){ stop(); retreat(); }
  else if(ev.key===' '){ ev.preventDefault(); timer?stop():play(); }
});

/* ---------- Parts: one walkthrough per function ---------- */
FN.forEach(e=>{
  const spec=(typeof PARTS!=='undefined' && PARTS[e.n]) || [{t:e.n, inherit:1}];
  e.parts=spec.map(p=>{
    const m={...e, ...p}; delete m.parts;
    if(!p.inherit && !('fill' in p)) m.fill=null;
    if(p.inherit && !('fill' in p) && spec.length>1) m.fill=null;
    if(p.last){ m.steps=m.steps.map((x,i,a)=> i===a.length-1 ? [x[0],p.last,x[2]] : x); }
    return m;
  });
  e.keys=(e.keys||'')+' '+e.parts.map(p=>p.t).join(' ');
});
applyTheme(theme);
buildNav();
function fromHash(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(h && PAGES[h]) return openPage(h);
  const f=FN.find(x=>x.n===h); if(f) return openFn(f.id);
  if(!cur && !document.querySelector('.body.page-mode')) showEmpty();
}
function showEmpty(){
  stop(); cur=null; curEntry=null;
  $('body').classList.remove('page-mode'); $('catHint').textContent='';
  const hint=t=>`<div class="empty">${t}</div>`;
  $('formula').innerHTML=hint('Pick a category under <b>Topics</b>, then a function. Its syntax and formula appear here.');
  $('sheet').innerHTML=hint('The worksheet lights up the cells each formula reads. Press ▶ or the → key to step through.');
  $('output').innerHTML=hint('The result appears here once the formula is evaluated.');
  $('steps').innerHTML=hint('Each step shows the formula as Excel evaluates it.');
  $('qa').innerHTML=hint('Interview questions for the selected function.');
  $('co').innerHTML=hint('Tips and traps to watch for.');
  $('stepCount').textContent=''; $('prevBtn').disabled=true; $('nextBtn').disabled=true;
}
addEventListener('hashchange',fromHash);
try{ if('scrollRestoration' in history) history.scrollRestoration='manual'; }catch(e){}
(function(){
  const nav=(performance.getEntriesByType && performance.getEntriesByType('navigation')[0])||{};
  if(nav.type==='reload' && location.hash){ try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} }
  fromHash();
})();
</script>
</body>
</html>
